<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | SHOPORA</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    #ffd6e5,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    #cfe9ff,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #fff1f6,
                    #eef7ff,
                    #f8f0ff
                );
        }


        .auth-container {

            width: 100%;

            max-width: 450px;

            background: rgba(255,255,255,0.9);

            backdrop-filter: blur(15px);

            padding: 45px;

            border-radius: 28px;

            box-shadow:
                0 25px 70px
                rgba(50,40,60,0.15);
        }


        .logo {

            text-align: center;

            font-size: 40px;

            font-weight: 800;

            color: #111;

            margin-bottom: 8px;
        }


        .logo span {

            color: #df5b91;
        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 32px;

            font-size: 15px;
        }


        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 700;
        }


        input {

            width: 100%;

            padding: 15px 16px;

            border: 1px solid #ddd;

            border-radius: 12px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }


        input:focus {

            border-color: #df5b91;

            box-shadow:
                0 0 0 3px
                rgba(223,91,145,0.1);
        }


        .login-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #111;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;
        }


        .login-btn:hover {

            background: #df5b91;

            transform: translateY(-2px);
        }


        .form-message {

            text-align: center;

            margin-top: 18px;

            font-size: 14px;

            min-height: 20px;
        }


        .form-message.error {

            color: #d93025;
        }


        .form-message.success {

            color: #188038;
        }


        .auth-link {

            text-align: center;

            margin-top: 25px;

            color: #777;

            font-size: 14px;
        }


        .auth-link a {

            color: #df5b91;

            text-decoration: none;

            font-weight: 700;
        }


        .back-home {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #555;

            text-decoration: none;

            font-size: 13px;
        }


        @media(max-width: 500px) {

            .auth-container {

                padding: 32px 22px;

            }

            .logo {

                font-size: 34px;

            }
        }

    </style>

</head>


<body>


    <div class="auth-container">

        <div class="logo">
            SHOPORA<span>.</span>
        </div>


        <p class="subtitle">
            Login to your SHOPORA account
        </p>


        <form onsubmit="loginUser(event)">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


            <div
                id="form-message"
                class="form-message"
            ></div>


        </form>


        <div class="auth-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to SHOPORA
        </a>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
